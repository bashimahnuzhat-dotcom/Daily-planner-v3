<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Student Planner V3</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#160b2e,#32135d);color:#fff;padding:16px}
.card{background:#241044cc;border:1px solid #a879e8;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px #0005}
h1{margin:4px 0;color:#e6c8ff}.sub{color:#cbb1e8}.grid{display:grid;gap:10px}.two{grid-template-columns:repeat(2,1fr)}
input,textarea,button{width:100%;padding:11px;border-radius:10px;border:1px solid #8f65bd;background:#170b2b;color:white}button{background:#6e3fa3;font-weight:700}
.row{display:flex;gap:8px;align-items:center}.row input{width:auto}.xp{height:12px;background:#120820;border-radius:10px;overflow:hidden}.xp i{display:block;height:100%;background:#d9a7ff}
.item{padding:10px;border:1px solid #69448b;border-radius:10px;margin:7px 0}
.big{text-align:center;font-size:36px;font-weight:800}.gold{color:#ffd98a}
</style></head>
<body>
<div class="card"><h1>🪄 Magic Student Planner</h1><div class="sub">V3 • Your magical study companion</div>
<div class="grid two" style="margin-top:12px"><div>⭐ Level <b id="level">1</b></div><div>✨ XP <b id="xp">0</b></div><div>🔥 Streak <b id="streak">0</b> days</div><div>🏆 Badges <b id="badges">0</b></div></div>
<div class="xp" style="margin-top:10px"><i id="bar" style="width:0%"></i></div></div>

<div class="card"><h2>🎯 Today's Quests</h2><div class="grid two">
<input id="task" placeholder="Add a task"><button onclick="addTask()">Add Quest</button></div><div id="tasks"></div></div>

<div class="card"><h2>⏱️ Pomodoro</h2><div class="big" id="timer">25:00</div>
<div class="grid two"><button onclick="setT(25)">25 min</button><button onclick="setT(50)">50 min</button><button onclick="setT(15)">15 min</button><button onclick="setT(5)">5 min</button></div>
<div class="grid two" style="margin-top:10px"><button onclick="start()">Start</button><button onclick="pause()">Pause</button><button onclick="reset()">Reset</button><button onclick="skip()">Skip</button></div>
<p class="sub">Finish a focus session: +25 XP</p></div>

<div class="card"><h2>📚 Study Plan</h2><div class="grid two">
<input id="subject" placeholder="Subject"><input id="topic" placeholder="Topic / chapter"><button onclick="addStudy()">Add Study</button></div><div id="study"></div></div>

<div class="card"><h2>⭐ Top Priorities</h2><textarea id="notes" rows="6" placeholder="Write priorities, schedule, notes..."></textarea></div>
<script>
const KEY='magicStudentPlannerV3Android';
let d=JSON.parse(localStorage.getItem(KEY)||'{"xp":0,"streak":0,"last":"","tasks":[],"study":[],"sessions":0}');
function save(){localStorage.setItem(KEY,JSON.stringify(d));render()}
function level(){return Math.floor(d.xp/100)+1}
function addXP(n){d.xp+=n;save()}
function today(){return new Date().toISOString().slice(0,10)}
function streak(){let t=today();if(d.last!==t){d.streak++;d.last=t;d.xp+=5}}
function addTask(){let v=document.getElementById('task').value.trim();if(!v)return;d.tasks.push({t:v,done:false});document.getElementById('task').value='';save()}
function doneTask(i){if(!d.tasks[i].done){d.tasks[i].done=true;streak();d.xp+=10;save()}}
function addStudy(){let s=document.getElementById('subject').value.trim(),t=document.getElementById('topic').value.trim();if(!s&&!t)return;d.study.push({s,t,done:false});save()}
function doneStudy(i){if(!d.study[i].done){d.study[i].done=true;streak();d.xp+=15;save()}}
function render(){
 document.getElementById('xp').textContent=d.xp;document.getElementById('level').textContent=level();document.getElementById('streak').textContent=d.streak;
 document.getElementById('badges').textContent=[d.tasks.some(x=>x.done),d.tasks.filter(x=>x.done).length>=10,d.sessions>=5,level()>=5].filter(Boolean).length;
 document.getElementById('bar').style.width=(d.xp%100)+'%';
 document.getElementById('tasks').innerHTML=d.tasks.map((x,i)=>`<div class=item><label class=row><input type=checkbox ${x.done?'checked disabled':''} onchange="doneTask(${i})"> ${esc(x.t)}</label></div>`).join('');
 document.getElementById('study').innerHTML=d.study.map((x,i)=>`<div class=item><label class=row><input type=checkbox ${x.done?'checked disabled':''} onchange="doneStudy(${i})"> <b>${esc(x.s)}</b> — ${esc(x.t)}</label></div>`).join('');
}
function esc(x){return x.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let sec=1500,run=false,id;
function show(){document.getElementById('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function setT(m){pause();sec=m*60;show()}function start(){if(run)return;run=true;id=setInterval(()=>{if(--sec<=0){clearInterval(id);run=false;d.sessions++;streak();d.xp+=25;alert('✨ Focus session complete! +25 XP');save()}show()},1000)}
function pause(){clearInterval(id);run=false}function reset(){pause();sec=1500;show()}function skip(){pause();sec=0;show()}
render();show();let n=document.getElementById('notes');n.value=localStorage.getItem('plannerNotes')||'';n.oninput=()=>localStorage.setItem('plannerNotes',n.value);
</script></body></html>
